<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<meta property="og:title" content="Sneak Tracker">
		<meta property="og:description" content="See your queue in the commissions in real-time!">
		<meta property="og:image" content="https://naughtysneak.github.io/sneaktracker/Graphics/Beast-Face.png">
		<meta property="og:url" content="https://naughtysneak.github.io/sneaktracker/">
		<meta property="og:type" content="website">
		
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="Sneak Tracker">
		<meta name="twitter:description" content="See your queue in the commissions in real-time!">
		<meta name="twitter:image" content="https://naughtysneak.github.io/sneaktracker/Graphics/Beast-Face.png">
		
		<title>Sneaktracker</title>
		<link rel="stylesheet" href="./CSS/main.css?v=1.2.0" type="text/css">
	</head>

	<body>
		<div id="radialTimer"></div>
		<h1 class="queueTitle">Commission Queues</h1>
		<div id="queuesContainer">
			<h2 class="queueTitle">Reservation List</h2>
			<div id="reservationQueue">
			</div>
			<h2 class="queueTitle">Order Queue</h2>
			<div id="orderQueue">
			</div>
		</div>
		<div id="progressBar">
			<p id="financialProgressText"></p>
		</div>
	</body>

	<script src="./JS/queueReader.js?v=1.0.0"></script>
	<script>
		FetchData();
		
		let elapsed = performance.now();
		let radialTimer = document.getElementById('radialTimer');
		let radialFill = 0;

		let fillInterval = null;
		let fillRate = 100.0 / 10000.0;
		UpdateLoop();
		
		function UpdateLoop()
		{
			fillInterval = setInterval(() => {
				let now = performance.now();
				let delta = now - elapsed;
				elapsed = now;

				radialFill += delta * fillRate;
				
				if (radialFill > 100)
				{
					FetchData();
					radialFill %= 100;
				}
				
				radialTimer.style.setProperty('--radial-fill', (radialFill) + '%');
			}, 10);
		}
		
		window.addEventListener('visibilitychange', () => {
			clearInterval(fillInterval);
			
			if (!document.hidden)
				UpdateLoop();
		});
	</script>
</html>
